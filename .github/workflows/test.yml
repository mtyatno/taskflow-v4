name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pytz python-dotenv dateparser trafilatura pytest httpx mistune "python-telegram-bot[job-queue]==21.*"
      # tests/test_safehtml_parity_node.py menjalankan tes paritas JS ↔ Python (node --test)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python -m pytest tests/ -q
