name: Deploy Taskflow V4

on:
  push:
    branches: [main]

# Satu deploy dalam satu waktu: dua deploy paralel = dua pip install ke venv yang
# sama → paket fastapi campur versi (ImportError PYDANTIC_V2, outage 2026-10-06).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/yatno/todo-system/taskflow-v4
            rm -f .git/refs/remotes/origin/main.lock .git/index.lock
            git checkout -- static/index.html package-lock.json
            git fetch --prune origin main
            git reset --hard origin/main
            npm install --prefer-offline
            node compile.js
            rm -rf draw-app/node_modules
            cd draw-app && npm ci --prefer-offline && npx vite build && cd ..
            cd /home/yatno/todo-system/taskflow-v4
            venv/bin/pip install -r requirements.txt
