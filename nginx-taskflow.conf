# TaskFlow V4 — Nginx Configuration
# Copy to: /etc/nginx/sites-available/taskflow
# Then: sudo ln -s /etc/nginx/sites-available/taskflow /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name __SUBDOMAIN__;

    # Redirect HTTP → HTTPS (uncomment after certbot)
    # return 301 https://$server_name$request_uri;

    # Media note (audio/video): Alurik memvalidasi token /media/<token>, lalu nginx
    # menyajikan file lewat X-Accel-Redirect (Range/206 ditangani nginx).
    # Verifikasi deploy:
    #   curl -sI -H 'Range: bytes=0-99' https://<host>/media/<token>
    # harus menghasilkan 206, Content-Type = mime media, dan Content-Disposition ada.
    location /_alurik_media/ {
        internal;
        alias /var/lib/alurik/media/;
        # nginx tidak meneruskan header kustom upstream pada internal redirect; pasang ulang.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    # Unggah media bertahap (PATCH potongan <= 6 MB): jangan buffer body ke disk.
    location ~ ^/api/media/\d+/upload$ {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

