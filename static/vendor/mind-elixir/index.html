<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmap</title>
  <link rel="stylesheet" href="MindElixir.css?v=120">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #map { flex: 1; min-height: 0; overflow: hidden; }

    #fmt-toolbar {
      display: none;
      flex-shrink: 0;
      border-bottom: 2px solid #6c7ae0;
      background: #12122a;
      padding: 4px 12px;
      font-family: system-ui, sans-serif;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-wrap: wrap;
    }
    #fmt-toolbar button {
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 20px;
      padding: 3px 9px;
      color: #ccc;
      font-size: 13px;
      -webkit-tap-highlight-color: transparent;
      min-width: 28px;
    }
    #fmt-toolbar button:hover, #fmt-toolbar button:active { background: rgba(108,122,224,0.18); }
    #fmt-toolbar .sep { width: 1px; height: 20px; background: #3a3a6a; margin: 0 4px; }
    #node-toolbar {
      display: none;
      flex-shrink: 0;
      border-bottom: 2px solid #6c7ae0;
      background: #12122a;
      padding: 6px 12px;
      font-family: system-ui, sans-serif;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #node-toolbar button {
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 24px;
      padding: 6px 12px;
      color: #ccc;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    #node-toolbar button .lbl { font-size: 9px; color: #888; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
    #node-toolbar button:hover, #node-toolbar button:active { background: rgba(108,122,224,0.18); }
    #node-toolbar button.danger { color: #e06c6c; }
    #node-toolbar button.danger:hover, #node-toolbar button.danger:active { background: rgba(224,108,108,0.18); }
    #node-toolbar .sep { width: 1px; height: 28px; background: #3a3a6a; margin: 0 4px; }

    #link-panel {
      display: none;
      flex-shrink: 0;
      border-top: 2px solid #6c7ae0;
      background: #12122a;
      padding: 8px 12px;
      max-height: 160px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: #ccc;
    }
    #link-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: #ddd;
    }
    #link-panel-close {
      cursor: pointer;
      color: #666;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }
    #link-panel-close:hover { color: #aaa; }
    #link-panel-items {
      display: flex;
      gap: 8px;
      align-items: stretch;
      overflow-x: auto;
    }
    .lp-card {
      background: #1e1e38;
      border: 1px solid #3a3a6a;
      border-radius: 7px;
      padding: 7px 10px;
      min-width: 160px;
      max-width: 220px;
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .lp-card:hover { border-color: #6c7ae0; }
    .lp-card-row { display: flex; align-items: center; gap: 5px; }
    .lp-badge {
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .lp-badge-note { background: #6c7ae0; }
    .lp-badge-task { background: #e0a06c; }
    .lp-title { font-weight: 600; font-size: 11px; color: #ddd; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .lp-open { color: #6c7ae0; font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .lp-open:hover { color: #9aa7f0; }
    .lp-remove { color: #e06c6c; font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .lp-remove:hover { color: #ff9a9a; }
    .lp-preview { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lp-add-btn {
      background: transparent;
      border: 1.5px dashed #3a3a6a;
      border-radius: 7px;
      padding: 7px 14px;
      color: #6c7ae0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      align-self: stretch;
      display: flex;
      align-items: center;
    }
    .lp-add-btn:hover { border-color: #6c7ae0; }

    #lp-picker-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-family: system-ui, sans-serif;
    }
    #lp-picker-box {
      background: #1a1a2e; border: 1px solid #3a3a6a; border-radius: 12px;
      padding: 20px; width: 420px; max-width: 95vw; max-height: 70vh;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #lp-picker-header { display: flex; justify-content: space-between; align-items: center; }
    #lp-picker-title { font-weight: 700; font-size: 15px; color: #ddd; }
    #lp-picker-close { cursor: pointer; color: #666; font-size: 20px; line-height: 1; padding: 0 4px; }
    #lp-picker-close:hover { color: #aaa; }
    #lp-picker-input {
      width: 100%; padding: 9px 13px; border-radius: 8px;
      border: 1px solid #3a3a6a; background: #12122a;
      color: #ddd; font-size: 13px; outline: none; box-sizing: border-box;
    }
    #lp-picker-input:focus { border-color: #6c7ae0; }
    #lp-picker-tabs { display: flex; gap: 6px; }
    .lp-tab {
      padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid #3a3a6a; color: #aaa; background: transparent;
    }
    .lp-tab.active { background: #6c7ae0; color: white; border-color: #6c7ae0; }
    #lp-picker-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .lp-result-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 8px; border: 1px solid #3a3a6a; cursor: pointer;
    }
    .lp-result-item:hover { border-color: #6c7ae0; background: #1e1e38; }
    .lp-result-badge {
      border-radius: 3px; padding: 1px 6px; font-size: 10px; font-weight: 700;
      color: white; flex-shrink: 0;
    }
    .lp-result-title { font-size: 13px; font-weight: 600; color: #ddd; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .lp-result-meta { font-size: 10px; color: #666; flex-shrink: 0; }
    .lp-picker-hint { color: #555; font-size: 13px; text-align: center; padding: 20px; }

    .node-link-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #e0a06c;
      color: white;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }

    .map-container .text ul, .map-container .text ol { margin: 3px 0 3px 18px; padding: 0; }
    .map-container .text li { margin: 1px 0; }
    .map-container .text table { border-collapse: collapse; margin: 4px 0; font-size: 0.92em; }
    .map-container .text th, .map-container .text td { border: 1px solid #3a3a6a; padding: 2px 6px; }
    .map-container .text hr { border: none; border-top: 1px solid #3a3a6a; margin: 5px 0; }
    .map-container .text code { background: #1e1e38; border: 1px solid #3a3a6a; border-radius: 3px; padding: 0 4px; font-size: 0.9em; }
    .map-container .text a { color: #6c7ae0; }



  </style>
</head>
<body>
  <div id="app">
    <div id="fmt-toolbar">
      <button data-act="bold" title="Bold (tebal)"><b>B</b></button>
      <button data-act="italic" title="Italic (miring)"><i>I</i></button>
      <button data-act="underline" title="Underline (garis bawah)"><u>U</u></button>
      <button data-act="strike" title="Coret"><s>S</s></button>
      <button data-act="highlight" title="Highlight">✨</button>
      <button data-act="heading" title="Heading">H</button>
      <button data-act="code" title="Inline code">&lt;/&gt;</button>
      <button data-act="link" title="Link">🔗</button>
      <button data-act="table" title="Tabel">⊞</button>
      <div class="sep"></div>
      <button data-act="ul" title="List •">•</button>
      <button data-act="ol" title="List angka">1.</button>
      <button data-act="hr" title="Garis pemisah">─</button>
      <div class="sep"></div>
      <button data-act="align" data-align="left" title="Rata kiri">L</button>
      <button data-act="align" data-align="center" title="Tengah">C</button>
      <button data-act="align" data-align="right" title="Rata kanan">R</button>
      <button data-act="align" data-align="justify" title="Rata penuh">J</button>
    </div>
    <div id="node-toolbar">
      <button id="ntb-child" title="Tambah Child (Tab)">↳<span class="lbl">Child</span></button>
      <button id="ntb-sibling" title="Tambah Sibling (Enter)">↵<span class="lbl">Sibling</span></button>
      <button id="ntb-promote" title="Naikan level — jadi sibling dari parent">↑<span class="lbl">Promote</span></button>
      <div class="sep"></div>
      <button id="ntb-edit" title="Edit teks node (F2)">✏️<span class="lbl">Edit</span></button>
      <div class="sep"></div>
      <button id="ntb-delete" class="danger" title="Hapus node (Delete)">🗑️<span class="lbl">Hapus</span></button>
    </div>
    <div id="map"></div>
    <div id="link-panel">
      <div id="link-panel-header">
        <span id="link-panel-title">🔗 Links</span>
        <span id="link-panel-close" title="Tutup">✕</span>
      </div>
      <div id="link-panel-items"></div>
    </div>
  </div>
  <script src="MindElixir.iife.js?v=120"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/offline/mindmapoutline.js"></script>
  <script>
    let mind = null;

    let currentNodeId = null;
    let currentNodeData = null;
    let unselectTimer = null;

    function findNode(node, id) {
      if (node.id === id) return node;
      for (const c of (node.children || [])) {
        const found = findNode(c, id);
        if (found) return found;
      }
      return null;
    }

    function showPanel() { document.getElementById('link-panel').style.display = 'block'; }
    function hidePanel() { document.getElementById('link-panel').style.display = 'none'; }

    function renderPanel(topic, links) {
      document.getElementById('link-panel-title').textContent = '🔗 Links — ' + topic;
      const container = document.getElementById('link-panel-items');
      container.innerHTML = '';

      links.forEach((link, idx) => {
        const card = document.createElement('div');
        card.className = 'lp-card';

        const row = document.createElement('div');
        row.className = 'lp-card-row';

        const badge = document.createElement('span');
        badge.className = 'lp-badge ' + (link.type === 'note' ? 'lp-badge-note' : 'lp-badge-task');
        badge.textContent = link.type === 'note' ? 'NOTE' : 'TASK';

        const title = document.createElement('span');
        title.className = 'lp-title';
        title.textContent = link.title;

        const openBtn = document.createElement('span');
        openBtn.className = 'lp-open';
        openBtn.textContent = '↗';
        openBtn.title = 'Buka';
        openBtn.onclick = () => {
          const msgType = link.type === 'note' ? 'openNote' : 'openTask';
          const send = () => window.parent.postMessage({ type: msgType, id: link.id }, window.location.origin);
          if (document.fullscreenElement) {
            document.exitFullscreen().finally(send);
          } else {
            send();
          }
        };

        const removeBtn = document.createElement('span');
        removeBtn.className = 'lp-remove';
        removeBtn.textContent = '✕';
        removeBtn.title = 'Hapus link';
        removeBtn.onclick = () => removeLinkAtIndex(idx);

        row.append(badge, title, openBtn, removeBtn);

        const preview = document.createElement('div');
        preview.className = 'lp-preview';
        if (link.type === 'task') {
          const parts = [];
          if (link.priority) parts.push(link.priority);
          if (link.deadline) parts.push('Due ' + link.deadline.slice(0, 10));
          if (link.status) parts.push(link.status);
          preview.textContent = parts.join(' · ') || '—';
        } else {
          preview.textContent = link.preview || '';
        }

        card.append(row, preview);
        container.appendChild(card);
      });

      // Add link button
      const addBtn = document.createElement('button');
      addBtn.className = 'lp-add-btn';
      addBtn.textContent = '+ Tambah link';
      addBtn.onclick = () => showLinkPicker();
      container.appendChild(addBtn);

      showPanel();
    }

    function removeLinkAtIndex(idx) {
      if (!currentNodeId || !currentNodeData) return;
      currentNodeData.links = (currentNodeData.links || []).filter((_, i) => i !== idx);
      renderPanel(currentNodeData.topic, currentNodeData.links);
      updateBadges();
      window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
    }

    function showLinkPicker() {
      if (!currentNodeId || !currentNodeData) return;
      if (document.getElementById('lp-picker-overlay')) return;

      const token = localStorage.getItem('tf_token');
      let activeTab = 'all';
      let searchResults = null;
      let debounceTimer = null;
      const existingSet = new Set((currentNodeData.links || []).map(l => `${l.type}-${l.id}`));

      const overlay = document.createElement('div');
      overlay.id = 'lp-picker-overlay';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      overlay.innerHTML = `
        <div id="lp-picker-box">
          <div id="lp-picker-header">
            <span id="lp-picker-title">🔗 Tambah Link</span>
            <span id="lp-picker-close">✕</span>
          </div>
          <input id="lp-picker-input" placeholder="Cari note atau task..." autocomplete="off" />
          <div id="lp-picker-tabs">
            <button class="lp-tab active" data-tab="all">Semua</button>
            <button class="lp-tab" data-tab="notes">Notes</button>
            <button class="lp-tab" data-tab="tasks">Tasks</button>
          </div>
          <div id="lp-picker-results"><p class="lp-picker-hint">Ketik untuk mencari...</p></div>
        </div>`;

      document.getElementById('app').appendChild(overlay);

      const input = overlay.querySelector('#lp-picker-input');
      const resultsEl = overlay.querySelector('#lp-picker-results');
      input.focus();

      overlay.querySelector('#lp-picker-close').onclick = () => overlay.remove();

      overlay.querySelectorAll('.lp-tab').forEach(btn => {
        btn.onclick = () => {
          activeTab = btn.dataset.tab;
          overlay.querySelectorAll('.lp-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderResults();
        };
      });

      function renderResults() {
        if (!searchResults) { resultsEl.innerHTML = '<p class="lp-picker-hint">Ketik untuk mencari...</p>'; return; }
        const notes = (searchResults.notes || []).filter(n => !existingSet.has(`note-${n.id}`));
        const tasks = (searchResults.tasks || []).filter(t => !existingSet.has(`task-${t.id}`));
        const items = activeTab === 'notes' ? notes.map(n => ({...n, _type:'note'}))
                    : activeTab === 'tasks' ? tasks.map(t => ({...t, _type:'task'}))
                    : [...notes.map(n => ({...n, _type:'note'})), ...tasks.map(t => ({...t, _type:'task'}))];
        if (items.length === 0) { resultsEl.innerHTML = '<p class="lp-picker-hint">Tidak ada hasil</p>'; return; }
        resultsEl.innerHTML = '';
        items.forEach(item => {
          const el = document.createElement('div');
          el.className = 'lp-result-item';
          const color = item._type === 'note' ? '#6c7ae0' : '#e0a06c';
          const label = item._type === 'note' ? 'NOTE' : 'TASK';
          const meta = item._type === 'task' && item.priority ? item.priority : '';
          el.innerHTML = `<span class="lp-result-badge" style="background:${color}">${label}</span>
            <span class="lp-result-title">${item.title}</span>
            ${meta ? `<span class="lp-result-meta">${meta}</span>` : ''}`;
          el.onclick = () => {
            const link = item._type === 'note'
              ? { type: 'note', id: item.id, title: item.title, preview: (item.content || '').slice(0, 60) }
              : { type: 'task', id: item.id, title: item.title, priority: item.priority, deadline: item.deadline, status: item.gtd_status };
            if (!currentNodeData.links) currentNodeData.links = [];
            if (!currentNodeData.links.some(l => l.type === link.type && l.id === link.id)) {
              currentNodeData.links.push(link);
              renderPanel(currentNodeData.topic, currentNodeData.links);
              updateBadges();
              window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
            }
            overlay.remove();
          };
          resultsEl.appendChild(el);
        });
      }

      input.oninput = () => {
        clearTimeout(debounceTimer);
        const q = input.value.trim();
        if (!q) { searchResults = null; renderResults(); return; }
        resultsEl.innerHTML = '<p class="lp-picker-hint">Mencari...</p>';
        debounceTimer = setTimeout(() => {
          fetch(`/api/search?q=${encodeURIComponent(q)}`, {
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
          })
            .then(r => r.json())
            .then(data => { searchResults = data; renderResults(); })
            .catch(() => { resultsEl.innerHTML = '<p class="lp-picker-hint">Gagal mencari</p>'; });
        }, 300);
      };
    }

    function updateBadges() {
      document.querySelectorAll('.node-link-badge').forEach(el => el.remove());
      function apply(nodeData) {
        const allTopics = document.querySelectorAll('me-tpc');
        allTopics.forEach(el => {
          if (el.nodeObj && el.nodeObj.id === nodeData.id) {
            el.style.textAlign = nodeData.align || '';
            const count = (nodeData.links || []).length;
            if (count > 0) {
              el.style.position = 'relative';
              const badge = document.createElement('span');
              badge.className = 'node-link-badge';
              badge.textContent = count;
              el.appendChild(badge);
            }
          }
        });
        (nodeData.children || []).forEach(apply);
      }
      apply(mind.getData().nodeData);
    }

    function initMind(data) {
      if (mind) {
        mind.init(data);
        return;
      }
      const ME = MindElixir.default || MindElixir;
      mind = new ME({
        el: '#map',
        direction: MindElixir.SIDE,
        draggable: true,
        editable: true,
        contextMenu: true,
        toolBar: true,
        keypress: true,
        markdown: (topic) => (window.TF && window.TF.mindmapoutline && window.TF.mindmapoutline.renderTopicMd)
          ? window.TF.mindmapoutline.renderTopicMd(topic)
          : topic,
      });
      // Redirect fullscreen from #map to #app so #link-panel stays visible
      const mapEl = document.getElementById('map');
      mapEl.requestFullscreen = () => document.getElementById('app').requestFullscreen();

      mind.init(data);
      setTimeout(updateBadges, 300);
      // 5.15.1 only fires the 'selectNewNode' bus event for PROGRAMMATIC
      // selections (post-creation etc.) — a plain user click calls
      // selectNode(el) with no flag, so the event never fires. Wrap the
      // public selectNode method instead: it covers every selection path
      // (click, dblclick, keyboard nav, post-creation).
      const origSelectNode = mind.selectNode.bind(mind);
      mind.selectNode = el => {
        origSelectNode(el);
        clearTimeout(unselectTimer);
        const nodeObj = el && el.nodeObj;
        if (!nodeObj) return;
        currentNodeId = nodeObj.id;
        currentNodeData = nodeObj; // live reference to internal nodeObj — not a getData() copy
        renderPanel(nodeObj.topic, nodeObj.links || []);
        document.getElementById('node-toolbar').style.display = 'flex';
        window.parent.postMessage(
          { type: 'nodeSelected', nodeId: nodeObj.id, topic: nodeObj.topic, links: nodeObj.links || [] },
          window.location.origin
        );
      };

      const origUnselectNodes = mind.unselectNodes.bind(mind);
      mind.unselectNodes = els => {
        try { origUnselectNodes(els); } catch (_) {}
        unselectTimer = setTimeout(() => {
          currentNodeId = null;
          currentNodeData = null;
          hidePanel();
          document.getElementById('node-toolbar').style.display = 'none';
          window.parent.postMessage({ type: 'nodeDeselected' }, window.location.origin);
        }, 50);
      };

      // Every layout() rebuilds the node DOM from scratch (nodes.innerHTML = ""),
      // which wipes the .node-link-badge children added by updateBadges. Re-apply
      // after every layout so badges survive init/refresh/direction changes/edits.
      // (Badges are position:absolute — they don't change layout, so no loop.)
      const origLayout = mind.layout.bind(mind);
      mind.layout = () => {
        origLayout();
        setTimeout(updateBadges, 0);
      };

      // Node toolbar button handlers
      document.getElementById('ntb-child').onclick = () => { if (mind.currentNodes) mind.addChild(); };
      document.getElementById('ntb-sibling').onclick = () => { if (mind.currentNodes) mind.insertSibling('after'); };
      document.getElementById('ntb-promote').onclick = () => {
        if (!mind.currentNodes || mind.currentNodes.length === 0) return;
        const nodeEl = mind.currentNodes[0];
        const nodeObj = nodeEl.nodeObj;
        if (!nodeObj?.parent?.parent) return;
        const parentEl = mind.findEle(nodeObj.parent.id);
        // moveNodeAfter butuh ARRAY di argumen pertama (internal: ve(e).filter()).
        // Pindahkan node ke posisi tepat setelah parent-nya = promote satu level.
        // Memicu event 'operation' → listener kita auto postMessage 'change' (tersimpan).
        mind.moveNodeAfter([nodeEl], parentEl);
      };
      document.getElementById('ntb-edit').onclick = () => { if (mind.currentNodes) mind.beginEdit(); };
      document.getElementById('ntb-delete').onclick = () => {
        if (!mind.currentNodes) return;
        if (mind.currentNodes.some(n => !n.nodeObj?.parent)) return;
        if (confirm('Hapus node ini?')) mind.removeNodes(mind.currentNodes);
      };

      // ── Formatting toolbar ──────────────────────────────────────
      const FMT_ACTIONS = {
        bold:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "**", "**", "teks"),
        italic:    (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "*", "*", "teks"),
        underline: (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "<u>", "</u>", "teks"),
        strike:    (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "~~", "~~", "teks"),
        highlight: (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "__", "__", "sorot"),
        heading:   (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "# ", false),
        code:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "`", "`", "kode"),
        link:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "[", "](https://)", "teks"),
        table:     (t, s, e) => window.TF.mindmapoutline.insertBlock(t, s, e, "| Kolom 1 | Kolom 2 | Kolom 3 |\n| --- | --- | --- |\n| isi | isi | isi |"),
        ul:        (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "- ", false),
        ol:        (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "", true),
        hr:        (t, s, e) => window.TF.mindmapoutline.insertBlock(t, s, e, "---"),
      };

      function getEditSelection() {
        const box = document.getElementById('input-box');
        if (!box) return null;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || !box.contains(sel.anchorNode)) return { box, s: box.textContent.length, e: box.textContent.length };
        const range = document.createRange();
        range.selectNodeContents(box);
        range.setEnd(sel.anchorNode, sel.anchorOffset);
        const a = range.toString().length;
        range.selectNodeContents(box);
        range.setEnd(sel.focusNode, sel.focusOffset);
        const b = range.toString().length;
        return { box, s: Math.min(a, b), e: Math.max(a, b) };
      }

      function setEditCaret(box, start, end) {
        const sel = window.getSelection();
        const range = document.createRange();
        let pos = 0, startNode = null, startOff = 0, endNode = null, endOff = 0;
        (function walk(node) {
          if (endNode != null) return;
          if (node.nodeType === 3) {
            const len = node.textContent.length;
            if (startNode == null && pos + len >= start) { startNode = node; startOff = start - pos; }
            if (pos + len >= end) { endNode = node; endOff = end - pos; }
            pos += len;
          } else {
            for (const ch of node.childNodes) { if (endNode != null) break; walk(ch); }
          }
        })(box);
        if (startNode && endNode) {
          range.setStart(startNode, Math.max(0, Math.min(startOff, startNode.textContent.length)));
          range.setEnd(endNode, Math.max(0, Math.min(endOff, endNode.textContent.length)));
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }

      document.querySelectorAll('#fmt-toolbar button').forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.act === 'align') {
            if (!currentNodeData) return;
            currentNodeData.align = btn.dataset.align;
            updateBadges(); // re-applies textAlign via the post-layout pass
            window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
            return;
          }
          const fn = FMT_ACTIONS[btn.dataset.act];
          if (!fn) return;
          const ed = getEditSelection();
          if (!ed) return;
          const res = fn(ed.box.textContent, ed.s, ed.e);
          ed.box.textContent = res.text;
          setEditCaret(ed.box, res.selStart, res.selEnd);
          ed.box.focus();
        };
      });

      document.getElementById('link-panel-close').onclick = () => {
        hidePanel();
        currentNodeId = null;
        currentNodeData = null;
        window.parent.postMessage({ type: 'nodeDeselected' }, window.location.origin);
      };

      mind.bus.addListener('operation', (op) => {
        if (op && op.name === 'beginEdit') document.getElementById('fmt-toolbar').style.display = 'flex';
        if (op && op.name === 'finishEdit') document.getElementById('fmt-toolbar').style.display = 'none';
        window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
      });

      // Re-render panel after fullscreen exits so links stay visible
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && currentNodeId && currentNodeData) {
          setTimeout(() => renderPanel(currentNodeData.topic, currentNodeData.links || []), 100);
        }
      });
    }

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data && e.data.type === 'load') {
        hidePanel();
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        initMind(e.data.data);
        setTimeout(updateBadges, 300);
        const d = (e.data.data && typeof e.data.data.direction === 'number') ? e.data.data.direction : 2;
        try {
          if (d === 0) mind.initLeft();
          else if (d === 1) mind.initRight();
          else if (d === 3) mind.initDown();
          else mind.initSide();
        } catch (_) {}
      }
      if (e.data && e.data.type === 'refresh') {
        if (!mind) return;
        // mind.refresh clears map selection but not our module-level
        // currentNodeId/currentNodeData — reset like clearPanel so the link
        // panel never shows a renamed/removed node's old topic.
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        hidePanel();
        try { mind.refresh(e.data.data); } catch (_) {}
        setTimeout(updateBadges, 300);
        return;
      }
      if (e.data && e.data.type === 'setDirection') {
        if (!mind) return;
        try {
          const changed = mind.direction !== e.data.direction;
          if (e.data.direction === 0) mind.initLeft();
          else if (e.data.direction === 1) mind.initRight();
          else if (e.data.direction === 2) mind.initSide();
          else if (e.data.direction === 3) mind.initDown();
          else return;
          if (changed) {
            window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
          }
        } catch (_) {}
      }
      if (e.data && e.data.type === 'clearPanel') {
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        hidePanel();
      }
      if (e.data && e.data.type === 'addLink') {
        if (!currentNodeId || e.data.nodeId !== currentNodeId || !currentNodeData) return;
        if (!currentNodeData.links) currentNodeData.links = [];
        const alreadyLinked = currentNodeData.links.some(
          l => l.type === e.data.link.type && l.id === e.data.link.id
        );
        if (alreadyLinked) return;
        currentNodeData.links.push(e.data.link);
        renderPanel(currentNodeData.topic, currentNodeData.links);
        updateBadges();
        window.parent.postMessage({ type: 'change', data: mind.getData() }, window.location.origin);
      }
    });

    window.parent.postMessage({ type: 'ready' }, window.location.origin);
  </script>
</body>
</html>
