<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmap</title>
  <link rel="stylesheet" href="MindElixir.css?v=121">
  <style>
    :root {
      --side-bg: #ffffff;
      --side-border: #E8E8E0;
      --side-text: #0f172a;
      --side-muted: #64748b;
      --side-card: #FCFCFB;
      --side-hover: rgba(168,197,0,0.10);
      --side-accent: #A8C500;
      --side-accent-ink: #000000;
      --side-danger: #e06c6c;
    }
    [data-theme="dark"] {
      --side-bg: #262626;
      --side-border: #404040;
      --side-text: #e5e5e5;
      --side-muted: #a3a3a3;
      --side-card: #333333;
      --side-hover: rgba(168,197,0,0.12);
      --side-accent: #A8C500;
      --side-accent-ink: #000000;
      --side-danger: #e06c6c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #app { position: relative; display: flex; flex-direction: row; height: 100%; }
    #main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 0; overflow: hidden; }

    /* ── Right sidebar: collapsible panel + tabs ─────────────── */
    #side-panel {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--side-bg);
      border-left: 2px solid var(--side-accent);
      overflow: hidden;
      transition: width .25s ease;
      font-family: system-ui, sans-serif;
    }
    #app.side-collapsed #side-panel { width: 0; border-left-width: 0; }
    #export-row { display: flex; gap: 4px; padding: 8px 8px 4px; flex-shrink: 0; }
    #export-row button {
      flex: 1;
      background: var(--side-card);
      border: 1px solid var(--side-border);
      border-radius: 6px;
      color: var(--side-text);
      font-size: 11px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      padding: 5px 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #export-row button:hover, #export-row button:active { background: var(--side-hover); border-color: var(--side-accent); }
    #export-row button:disabled { opacity: 0.4; cursor: default; }
    #side-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--side-border); }
    .side-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      padding: 9px 4px;
      color: var(--side-muted);
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .side-tab:hover { background: var(--side-hover); color: var(--side-text); }
    .side-tab.active { background: var(--side-hover); color: var(--side-text); border-bottom-color: var(--side-accent); }
    #side-content { flex: 1; min-height: 0; overflow-y: auto; }
    #side-hint { padding: 16px 12px; color: var(--side-muted); font-size: 12px; text-align: center; }
    #side-toggle {
      position: absolute;
      top: 50%;
      right: 220px;
      transform: translateY(-50%);
      z-index: 5;
      width: 18px;
      height: 44px;
      padding: 0;
      background: var(--side-card);
      border: 1px solid var(--side-border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      color: var(--side-text);
      font-size: 12px;
      cursor: pointer;
      transition: right .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #side-toggle:hover { background: var(--side-hover); }
    #app.side-collapsed #side-toggle { right: 0; }

    /* ── Format pane (vertical button list) ──────────────────── */
    #fmt-panel { display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; align-content: start; }
    #fmt-panel button {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      width: 100%;
      padding: 0;
      background: var(--side-card);
      border: 1px solid var(--side-border);
      cursor: pointer;
      border-radius: 8px;
      color: var(--side-text);
      font-size: 15px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #fmt-panel button:hover, #fmt-panel button:active { background: var(--side-hover); border-color: var(--side-accent); }
    #fmt-panel .sep { display: none; }

    /* ── Node ops pane (vertical button list) ────────────────── */
    #node-ops-panel { display: none; flex-direction: column; padding: 8px; gap: 2px; }
    #node-ops-panel button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--side-text);
      font-size: 13px;
      font-family: inherit;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    #node-ops-panel button .lbl { font-size: 12px; color: var(--side-text); font-weight: 500; }
    #node-ops-panel button:hover, #node-ops-panel button:active { background: var(--side-hover); }
    #node-ops-panel button.danger { color: var(--side-danger); }
    #node-ops-panel button.danger .lbl { color: var(--side-danger); }
    #node-ops-panel button.danger:hover, #node-ops-panel button.danger:active { background: rgba(224,108,108,0.18); }
    #node-ops-panel .sep { height: 1px; background: var(--side-border); margin: 4px 8px; }
    #node-ops-panel button:disabled { opacity: 0.4; cursor: default; }
    #node-ops-panel button:disabled:hover, #node-ops-panel button:disabled:active { background: none; }
    #ops-link-hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--side-accent);
      color: var(--side-accent-ink);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      z-index: 9999;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      display: none;
    }

    #link-panel {
      display: none;
      background: var(--side-bg);
      padding: 8px 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: var(--side-text);
    }
    #link-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--side-text);
    }
    #link-panel-close {
      cursor: pointer;
      color: var(--side-muted);
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }
    #link-panel-close:hover { color: var(--side-text); }
    #link-panel-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .lp-card {
      background: var(--side-card);
      border: 1px solid var(--side-border);
      border-radius: 7px;
      padding: 7px 10px;
      min-width: 160px;
      max-width: 220px;
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .lp-card:hover { border-color: var(--side-accent); }
    .lp-card-row { display: flex; align-items: center; gap: 5px; }
    .lp-badge {
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
      color: var(--side-accent-ink);
      flex-shrink: 0;
    }
    .lp-badge-note { background: var(--side-accent); }
    .lp-badge-task { background: #e0a06c; }
    .lp-badge-mindmap { background: #8b5cf6; color: #fff; }
    .lp-title { font-weight: 600; font-size: 11px; color: var(--side-text); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .lp-open { color: var(--side-accent); font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .lp-open:hover { color: var(--side-accent); }
    .lp-remove { color: var(--side-danger); font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .lp-remove:hover { color: var(--side-danger); }
    .lp-stale { opacity: .7; }
    .lp-preview { font-size: 10px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lp-add-btn {
      background: transparent;
      border: 1.5px dashed var(--side-border);
      border-radius: 7px;
      padding: 7px 14px;
      color: var(--side-accent);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      align-self: stretch;
      display: flex;
      align-items: center;
    }
    .lp-add-btn:hover { border-color: var(--side-accent); }

    .map-container me-tpc .node-link-badge,
    .node-link-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e0a06c;
      color: #ffffff !important;
      border: 1.5px solid var(--side-bg, #ffffff);
      border-radius: 10px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      pointer-events: auto !important;
      cursor: pointer !important;
      z-index: 100 !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: transform 0.15s ease;
      line-height: 1;
      user-select: none;
    }
    .map-container me-tpc .node-link-badge:hover,
    .node-link-badge:hover {
      transform: scale(1.25);
      filter: brightness(1.1);
    }
    .map-container me-tpc .node-link-badge-mindmap,
    .node-link-badge-mindmap {
      background: #8b5cf6 !important;
      color: #ffffff !important;
    }
    .map-container me-tpc .node-link-badge-mixed,
    .node-link-badge-mixed {
      background: linear-gradient(135deg, #8b5cf6 50%, #e0a06c 50%) !important;
      color: #ffffff !important;
    }

    /* Floating Node Links Popover */
    .node-links-popover {
      position: fixed !important;
      z-index: 99999 !important;
      background: var(--side-bg, #ffffff) !important;
      color: var(--side-text, #0f172a) !important;
      border: 1.5px solid var(--side-border, #cbd5e1) !important;
      border-radius: 9px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35) !important;
      padding: 8px !important;
      width: 250px !important;
      max-width: 90vw !important;
      font-family: inherit !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      animation: popoverFadeIn 0.15s ease-out !important;
      pointer-events: auto !important;
    }
    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .nlp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--side-border, #e2e8f0);
    }
    .nlp-topic {
      font-size: 11px;
      font-weight: 700;
      color: var(--side-text, #0f172a);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .nlp-close {
      background: transparent;
      border: none;
      color: var(--side-muted, #64748b);
      font-size: 12px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .nlp-close:hover { color: var(--side-danger, #ef4444); }
    .nlp-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
    }
    .nlp-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--side-card, #f8fafc);
      border: 1px solid var(--side-border, #e2e8f0);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .nlp-item:hover {
      border-color: var(--side-accent, #6366f1);
      background: var(--side-hover, rgba(168,197,0,0.1));
    }
    .nlp-badge {
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 8px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }
    .nlp-badge-note { background: var(--side-accent, #6366f1); color: var(--side-accent-ink, #000); }
    .nlp-badge-task { background: #e0a06c; color: #fff; }
    .nlp-badge-mindmap { background: #8b5cf6; color: #fff; }
    .nlp-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--side-text, #0f172a);
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .nlp-open {
      color: var(--side-accent, #6366f1);
      font-size: 13px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .map-container .text ul, .map-container .text ol { margin: 3px 0 3px 18px; padding: 0; }
    .map-container .text li { margin: 1px 0; }
    .map-container .text table { border-collapse: collapse; margin: 4px 0; font-size: 0.92em; }
    .map-container .text th, .map-container .text td { border: 1px solid var(--side-border); padding: 2px 6px; }
    .map-container .text hr { border: none; border-top: 1px solid var(--side-border); margin: 5px 0; }
    .map-container .text code { background: var(--side-card); border: 1px solid var(--side-border); border-radius: 3px; padding: 0 4px; font-size: 0.9em; }
    .map-container .text a { color: var(--side-accent); }

    /* ── Peta tertaut: ringkasan bagian catatan di bawah teks node ── */
    .nm-sum{font-size:11px;line-height:1.35;margin-top:4px;max-width:260px;opacity:.75}
    .nm-sum-ex{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .nm-sum-it{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nm-sum-ct{font-size:10px}
    /* Item Summary di menu konteks engine tidak bisa dimatikan lewat opsi. */
    body.nm-linked #cm-summary { display: none; }



  </style>
</head>
<body>
  <div id="app">
    <div id="main-col">
      <div id="map"></div>
    </div>
    <div id="side-panel">
      <div id="export-row">
        <button id="export-png" title="Ekspor PNG (gambar)">🖼 PNG</button>
        <button id="export-svg" title="Ekspor SVG (vektor)">📄 SVG</button>
      </div>
      <div id="side-tabs">
        <button class="side-tab" data-tab="font">🎨 Font</button>
        <button class="side-tab" data-tab="ops">🔧 Ops</button>
        <button class="side-tab" data-tab="links">🔗 Links</button>
      </div>
      <div id="side-content">
        <div id="side-hint">Pilih node untuk mulai</div>
        <div id="fmt-panel">
          <button data-act="bold" title="Bold (tebal)"><b>B</b></button>
          <button data-act="italic" title="Italic (miring)"><i>I</i></button>
          <button data-act="underline" title="Underline (garis bawah)"><u>U</u></button>
          <button data-act="strike" title="Coret"><s>S</s></button>
          <button data-act="highlight" title="Highlight">✨</button>
          <button data-act="heading" title="Heading">H</button>
          <button data-act="code" title="Inline code">&lt;/&gt;</button>
          <button data-act="link" title="Link">🔗</button>
          <button data-act="table" title="Tabel">⊞</button>
          <div class="sep"></div>
          <button data-act="ul" title="List •">•</button>
          <button data-act="ol" title="List angka">1.</button>
          <button data-act="hr" title="Garis pemisah">─</button>
          <div class="sep"></div>
          <button data-act="align" data-align="left" title="Rata kiri">L</button>
          <button data-act="align" data-align="center" title="Tengah">C</button>
          <button data-act="align" data-align="right" title="Rata kanan">R</button>
          <button data-act="align" data-align="justify" title="Rata penuh">J</button>
        </div>
        <div id="node-ops-panel">
          <button id="ntb-opennote" title="Buka catatan di heading node ini (Ctrl+Click)" style="display:none">📄<span class="lbl">Buka di catatan</span></button>
          <button id="ntb-child" title="Tambah Child (Tab)">↳<span class="lbl">Child</span></button>
          <button id="ntb-sibling" title="Tambah Sibling (Enter)">↵<span class="lbl">Sibling</span></button>
          <button id="ntb-promote" title="Naikan level — jadi sibling dari parent">↑<span class="lbl">Promote</span></button>
          <button id="ntb-parent" title="Tambah Parent (Ctrl+Enter)">⤴<span class="lbl">Parent</span></button>
          <div class="sep"></div>
          <button id="ntb-edit" title="Edit teks node (F2)">✏️<span class="lbl">Edit</span></button>
          <div class="sep"></div>
          <button id="ntb-focus" title="Focus Mode — tampilkan hanya subtree node ini">🎯<span class="lbl">Focus Mode</span></button>
          <button id="ntb-cancelfocus" title="Cancel Focus Mode — kembalikan peta penuh">🎯<span class="lbl">Cancel Focus Mode</span></button>
          <button id="ntb-moveup" title="Move up (PgUp)">⇧<span class="lbl">Move up</span></button>
          <button id="ntb-movedown" title="Move down (PgDn)">⇩<span class="lbl">Move down</span></button>
          <button id="ntb-summary" title="Summary — buat node ringkasan dari seleksi">⧉<span class="lbl">Summary</span></button>
          <button id="ntb-link" title="Link — hubungkan panah ke node lain (tap target)">🔗<span class="lbl">Link</span></button>
          <button id="ntb-linkbi" title="Bidirectional Link — panah dua arah (tap target)">⇄<span class="lbl">Bidirectional Link</span></button>
          <div class="sep"></div>
          <button id="ntb-delete" class="danger" title="Hapus node (Delete)">🗑️<span class="lbl">Hapus</span></button>
        </div>
        <div id="link-panel">
          <div id="link-panel-header">
            <span id="link-panel-title">🔗 Links</span>
            <span id="link-panel-close" title="Tutup">✕</span>
          </div>
          <div id="link-panel-items"></div>
        </div>
      </div>
    </div>
    <button id="side-toggle" title="Tutup panel samping">◂</button>
  </div>
  <script src="MindElixir.iife.js?v=121"></script>
  <script src="/static/vendor/marked.min.js?v=124"></script>
  <script src="/static/offline/mindmapoutline.js?v=126"></script>
  <script src="/static/offline/mindmaplinks.js?v=1"></script>
  <script src="/static/offline/notemap.js?v=1"></script>
  <script src="/static/offline/mindmapops.js?v=7"></script>
  <script src="/static/offline/mindmapjustify.js?v=1"></script>
  <script>
    let mind = null;
    let currentMindmapTitle = "mindmap";
    let isJustifyActive = false;
    // Peta tertaut ke catatan (Petakan): node = heading catatan, nodeObj.nm.sid
    // menunjuk bagiannya. engineLinked = mode saat mesin dibuat (null = belum ada).
    let linkedMode = false;
    let showSummary = true;
    let engineLinked = null;
    // Generasi sesi induk (peta tertaut): sid node posisional terhadap versi catatan gen ini.
    // Dikirim balik di tiap change agar induk membuang pohon dari generasi lain.
    let linkedGen = null;

    function postChange() {
      const msg = { type: 'change', data: mind.getData() };
      if (linkedMode) msg.gen = linkedGen;
      window.parent.postMessage(msg, window.location.origin);
    }

    // Kirim openNoteAt untuk node ini (sid null untuk root / node baru).
    function sendOpenNoteAt(nodeObj, target) {
      if (!nodeObj) return;
      const sid = nodeObj.nm && nodeObj.nm.sid != null ? nodeObj.nm.sid : null;
      const send = () => window.parent.postMessage({ type: 'openNoteAt', sid: sid, target: target }, window.location.origin);
      if (document.fullscreenElement) {
        document.exitFullscreen().finally(send);
      } else {
        send();
      }
    }

    // Item extend menu konteks engine tidak menutup menunya sendiri.
    function openNoteFromContextMenu(evt, target) {
      const menu = evt && evt.target && evt.target.closest ? evt.target.closest('.context-menu') : null;
      if (menu) menu.hidden = true;
      sendOpenNoteAt(mind && mind.currentNode ? mind.currentNode.nodeObj : null, target);
    }

    function linkedMarkdown(topic, nodeObj) {
      const nm = window.TF.notemap;
      return nm.renderTopicNoteInline(topic) +
        (showSummary ? nm.renderSummaryHtml(nodeObj && nodeObj.nm && nodeObj.nm.summary) : '');
    }

    // Sembunyikan kontrol yang tidak bisa dipetakan ke catatan; peta biasa
    // memulihkan tampilan bawaan (gaya inline dikosongkan).
    function applyLinkedUi(linked) {
      document.body.classList.toggle('nm-linked', linked);
      window.TF.mindmapops.LINKED_HIDDEN_SELECTORS.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => { el.style.display = linked ? 'none' : ''; });
      });
      document.getElementById('ntb-opennote').style.display = linked ? '' : 'none';
    }

    function applyJustifyLayout() {
      if (!mind || !mind.map) return;
      const isVertical = mind.direction === 3;
      if (window.TF && window.TF.mindmapjustify) {
        window.TF.mindmapjustify.applyLevelJustify(mind.map, isJustifyActive, isVertical);
      }
      try {
        mind.linkDiv();
      } catch (_) {}
    }

    document.documentElement.setAttribute('data-theme', 'light');

    let currentNodeId = null;
    let currentNodeData = null;
    let unselectTimer = null;
    let linkFlowActive = false;
    let linkClickHandler = null;
    let linkHintEl = null;

    // ── Right sidebar: tabs + collapse ─────────────────────────
    const SIDE_PANES = { font: 'fmt-panel', ops: 'node-ops-panel', links: 'link-panel' };
    const SIDE_PANE_DISPLAY = { 'fmt-panel': 'grid', 'node-ops-panel': 'flex', 'link-panel': 'block' };

    function switchTab(name) {
      const paneId = SIDE_PANES[name] || null;
      ['fmt-panel', 'node-ops-panel', 'link-panel'].forEach(id => {
        document.getElementById(id).style.display = id === paneId ? SIDE_PANE_DISPLAY[id] : 'none';
      });
      document.getElementById('side-hint').style.display = paneId ? 'none' : 'block';
      document.querySelectorAll('#side-tabs .side-tab').forEach(btn => {
        btn.classList.toggle('active', !!paneId && btn.dataset.tab === name);
      });
    }

    const appEl = document.getElementById('app');
    const sideToggleEl = document.getElementById('side-toggle');
    function setSideCollapsed(collapsed) {
      appEl.classList.toggle('side-collapsed', collapsed);
      sideToggleEl.textContent = collapsed ? '▸' : '◂';
      sideToggleEl.title = collapsed ? 'Buka panel samping' : 'Tutup panel samping';
      try { localStorage.setItem('tf_mindmap_side', collapsed ? 'collapsed' : 'open'); } catch (_) {}
      // The engine has no resize listener — re-layout and re-center manually
      // after the width transition (mind.layout is wrapped: badges re-apply too).
      setTimeout(() => { if (mind) { try { mind.layout(); mind.toCenter(); } catch (_) {} } }, 270);
    }
    (function initSideCollapsed() {
      let collapsed = window.innerWidth < 768;
      try {
        const stored = localStorage.getItem('tf_mindmap_side');
        if (stored === 'open') collapsed = false;
        else if (stored === 'collapsed') collapsed = true;
      } catch (_) {}
      setSideCollapsed(collapsed);
    })();

    document.querySelectorAll('#side-tabs .side-tab').forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.tab);
    });
    sideToggleEl.onclick = () => setSideCollapsed(!appEl.classList.contains('side-collapsed'));

    switchTab(null);

    function findNode(node, id) {
      if (node.id === id) return node;
      for (const c of (node.children || [])) {
        const found = findNode(c, id);
        if (found) return found;
      }
      return null;
    }

    function showPanel() { document.getElementById('link-panel').style.display = 'block'; }
    function hidePanel() { document.getElementById('link-panel').style.display = 'none'; }

    // Info hidup per link (kunci TF.mindmaplinks.linkKey) dari induk lewat pesan 'linkInfo';
    // induk me-resolve lewat api.get lokal-first. Kosong → tampilkan snapshot di link.
    let liveLinkInfo = {};

    function renderPanel(topic, links) {
      document.getElementById('link-panel-title').textContent = '🔗 Links — ' + topic;
      const container = document.getElementById('link-panel-items');
      container.innerHTML = '';

      links.forEach((link, idx) => {
        const ML = window.TF && window.TF.mindmaplinks;
        const d = ML ? window.TF.mindmaplinks.linkDisplay(link, liveLinkInfo[ML.linkKey(link)]) : { title: link.title || '', meta: link.preview || '', live: false, stale: false, done: false };
        const card = document.createElement('div');
        card.className = 'lp-card';
        if (d.stale) {
          card.classList.add('lp-stale');
          if (ML) card.title = ML.UNAVAILABLE_TITLE;
        }

        const row = document.createElement('div');
        row.className = 'lp-card-row';

        const badge = document.createElement('span');
        badge.className = 'lp-badge ' + (link.type === 'note' ? 'lp-badge-note' : link.type === 'mindmap' ? 'lp-badge-mindmap' : 'lp-badge-task');
        badge.textContent = link.type === 'note' ? 'NOTE' : link.type === 'mindmap' ? 'MAP' : 'TASK';

        const handleOpen = () => {
          const msgType = link.type === 'note' ? 'openNote' : link.type === 'mindmap' ? 'openMindmap' : 'openTask';
          const send = () => window.parent.postMessage({ type: msgType, id: link.id }, window.location.origin);
          if (document.fullscreenElement) {
            document.exitFullscreen().finally(send);
          } else {
            send();
          }
        };

        const title = document.createElement('span');
        title.className = 'lp-title';
        title.textContent = d.title;
        if (d.done) title.style.textDecoration = 'line-through';
        title.style.cursor = 'pointer';
        title.title = 'Buka ' + (d.title || '');
        title.onclick = handleOpen;
        badge.style.cursor = 'pointer';
        badge.onclick = handleOpen;

        const openBtn = document.createElement('span');
        openBtn.className = 'lp-open';
        openBtn.textContent = '↗';
        openBtn.title = 'Buka';
        openBtn.onclick = handleOpen;

        const removeBtn = document.createElement('span');
        removeBtn.className = 'lp-remove';
        removeBtn.textContent = '✕';
        removeBtn.title = 'Hapus link';
        removeBtn.onclick = () => removeLinkAtIndex(idx);

        row.append(badge, title, openBtn, removeBtn);

        const preview = document.createElement('div');
        preview.className = 'lp-preview';
        preview.textContent = d.meta || (link.type === 'task' ? '—' : '');

        card.append(row, preview);
        container.appendChild(card);
      });

      // Add link button
      const addBtn = document.createElement('button');
      addBtn.className = 'lp-add-btn';
      addBtn.textContent = '+ Tambah link';
      addBtn.onclick = () => requestLinkPicker();
      container.appendChild(addBtn);

      showPanel();
    }

    function removeLinkAtIndex(idx) {
      if (!currentNodeId || !currentNodeData) return;
      currentNodeData.links = (currentNodeData.links || []).filter((_, i) => i !== idx);
      renderPanel(currentNodeData.topic, currentNodeData.links);
      updateBadges();
      postChange();
    }

    // Picker link milik induk (LinkPickerModal): pencarian + buat cepat lewat lapisan offline
    // (api.get/api.post lokal-first). Induk membalas dengan addLink { nodeId, link }.
    function requestLinkPicker() {
      if (!currentNodeId || !currentNodeData || linkedMode) return;
      const msg = { type: 'requestLinkPicker', nodeId: currentNodeId, links: currentNodeData.links || [] };
      const send = () => window.parent.postMessage(msg, window.location.origin);
      if (document.fullscreenElement) {
        document.exitFullscreen().finally(send);
      } else {
        send();
      }
    }

    let activePopover = null;
    let activeBadgeNodeId = null;

    function hideNodeLinksPopover() {
      if (activePopover) {
        activePopover.remove();
        activePopover = null;
        activeBadgeNodeId = null;
      }
    }

    function showNodeLinksPopover(nodeData, badgeEl) {
      if (activePopover && activeBadgeNodeId === nodeData.id) {
        hideNodeLinksPopover();
        return;
      }
      hideNodeLinksPopover();
      const links = nodeData.links || [];
      if (links.length === 0) return;

      const popover = document.createElement('div');
      popover.className = 'node-links-popover';

      const header = document.createElement('div');
      header.className = 'nlp-header';
      const topicEl = document.createElement('span');
      topicEl.className = 'nlp-topic';
      topicEl.textContent = '🔗 ' + (nodeData.topic || 'Links');
      const closeBtn = document.createElement('button');
      closeBtn.className = 'nlp-close';
      closeBtn.textContent = '✕';
      closeBtn.onclick = (e) => { e.stopPropagation(); hideNodeLinksPopover(); };
      header.append(topicEl, closeBtn);

      const list = document.createElement('div');
      list.className = 'nlp-list';

      links.forEach(link => {
        const ML = window.TF && window.TF.mindmaplinks;
        const d = ML ? window.TF.mindmaplinks.linkDisplay(link, liveLinkInfo[ML.linkKey(link)]) : { title: link.title || '', meta: link.preview || '', live: false, stale: false, done: false };
        const item = document.createElement('div');
        item.className = 'nlp-item';
        item.title = 'Buka ' + (d.title || '');
        if (d.stale) {
          item.classList.add('lp-stale');
          if (ML) item.title += '\n' + ML.UNAVAILABLE_TITLE;
        }

        const badge = document.createElement('span');
        badge.className = 'nlp-badge nlp-badge-' + (link.type || 'note');
        badge.textContent = link.type === 'note' ? 'NOTE' : link.type === 'mindmap' ? 'MAP' : 'TASK';

        const title = document.createElement('span');
        title.className = 'nlp-title';
        title.textContent = d.title;
        if (d.done) title.style.textDecoration = 'line-through';

        const openBtn = document.createElement('span');
        openBtn.className = 'nlp-open';
        openBtn.textContent = '↗';

        item.append(badge, title, openBtn);

        item.onclick = (e) => {
          e.stopPropagation();
          const msgType = link.type === 'note' ? 'openNote' : link.type === 'mindmap' ? 'openMindmap' : 'openTask';
          const send = () => window.parent.postMessage({ type: msgType, id: link.id }, window.location.origin);
          if (document.fullscreenElement) {
            document.exitFullscreen().finally(send);
          } else {
            send();
          }
          hideNodeLinksPopover();
        };

        list.appendChild(item);
      });

      popover.append(header, list);
      document.body.appendChild(popover);
      activePopover = popover;
      activeBadgeNodeId = nodeData.id;

      // Position popover
      const badgeRect = badgeEl.getBoundingClientRect();
      const popRect = popover.getBoundingClientRect();

      let top = badgeRect.bottom + 6;
      let left = Math.max(10, Math.min(window.innerWidth - popRect.width - 10, badgeRect.left - (popRect.width / 2) + (badgeRect.width / 2)));

      if (top + popRect.height > window.innerHeight - 10) {
        top = Math.max(10, badgeRect.top - popRect.height - 6);
      }

      popover.style.top = `${top}px`;
      popover.style.left = `${left}px`;
    }

    function updateBadges() {
      document.querySelectorAll('.node-link-badge').forEach(el => el.remove());
      function apply(nodeData) {
        const allTopics = document.querySelectorAll('me-tpc');
        allTopics.forEach(el => {
          if (el.nodeObj && el.nodeObj.id === nodeData.id) {
            el.style.textAlign = nodeData.align || '';
            const links = nodeData.links || [];
            const count = links.length;
            if (count > 0) {
              el.style.position = 'relative';
              const badge = document.createElement('span');
              const hasMindmap = links.some(l => l.type === 'mindmap');
              const hasOther = links.some(l => l.type !== 'mindmap');
              
              if (hasMindmap && hasOther) {
                badge.className = 'node-link-badge node-link-badge-mixed';
                badge.textContent = '🧠 ' + count;
              } else if (hasMindmap) {
                badge.className = 'node-link-badge node-link-badge-mindmap';
                badge.textContent = count === 1 ? '🧠' : '🧠 ' + count;
              } else {
                badge.className = 'node-link-badge';
                badge.textContent = count === 1 ? '🔗' : count;
              }

              const ML = window.TF && window.TF.mindmaplinks;
              badge.title = links.map(l => {
                const d = ML ? ML.linkDisplay(l, liveLinkInfo[ML.linkKey(l)]) : { title: l.title || '', stale: false };
                return `${l.type === 'mindmap' ? '🧠' : '🔗'} ${d.title}` + (d.stale && ML ? ' (' + ML.UNAVAILABLE_TITLE + ')' : '');
              }).join('\n');
              badge.addEventListener('mousedown', (e) => {
                e.stopPropagation();
              });
              badge.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
              });
              badge.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                showNodeLinksPopover(nodeData, badge);
              });
              el.appendChild(badge);
            }
          }
        });
        (nodeData.children || []).forEach(apply);
      }
      apply(mind.getData().nodeData);
    }

    function showLinkHint() {
      if (!linkHintEl) {
        linkHintEl = document.createElement('div');
        linkHintEl.id = 'ops-link-hint';
        document.getElementById('app').appendChild(linkHintEl);
      }
      linkHintEl.textContent = 'Tap node target';
      linkHintEl.style.display = 'block';
    }
    function hideLinkHint() {
      if (linkHintEl) linkHintEl.style.display = 'none';
    }
    function cancelLinkFlow() {
      if (linkClickHandler) {
        document.getElementById('map').removeEventListener('click', linkClickHandler);
        linkClickHandler = null;
      }
      linkFlowActive = false;
      hideLinkHint();
    }
    function startLinkFlow(bidirectional) {
      if (!window.TF || !window.TF.mindmapops) return;
      const sourceEl = mind.currentNodes && mind.currentNodes.length ? mind.currentNodes[0] : null;
      if (!sourceEl || linkFlowActive) return;
      linkFlowActive = true;
      showLinkHint();
      const mapEl = document.getElementById('map');
      linkClickHandler = (E) => {
        E.preventDefault();
        cancelLinkFlow();
        const ops = window.TF && window.TF.mindmapops;
        const tpc = ops ? ops.resolveTopicTarget(E.target) : null;
        if (tpc) mind.createArrow(sourceEl, tpc, { bidirectional: bidirectional });
      };
      mapEl.addEventListener('click', linkClickHandler, { once: true });
    }
    function refreshOpsDisabled() {
      if (!window.TF || !window.TF.mindmapops) return;
      const isRoot = !!(currentNodeData && !currentNodeData.parent);
      const d = window.TF.mindmapops.opsDisabledStates(isRoot);
      document.getElementById('ntb-parent').disabled = d.parent;
      document.getElementById('ntb-focus').disabled = d.focus;
      document.getElementById('ntb-moveup').disabled = d.moveUp;
      document.getElementById('ntb-movedown').disabled = d.moveDown;
      document.getElementById('ntb-sibling').disabled = d.sibling;
      document.getElementById('ntb-delete').disabled = d.remove;
    }

    // Fallback opsi markdown bila renderer topik belum dimuat: hasilnya dipakai sebagai HTML oleh mesin,
    // jadi topik di-escape (tampil sebagai teks), bukan dipakai mentah (spec XSS §7).
    function escapeTopicHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Mesin dibuat sekali per mode: load berikutnya dengan mode yang sama cukup
    // memuat data (reloadEngine: refresh untuk tertaut, init untuk biasa); mode berbeda (biasa ↔ tertaut) membuat mesin baru karena
    // opsinya (undo, menu konteks, markdown) hanya dibaca saat konstruksi.
    // Hasil: true bila mesin yang ada dipakai ulang (muat ulang), false bila mesin baru.
    function initMind(data, linked) {
      linked = !!linked;
      if (mind && engineLinked === linked) {
        window.TF.mindmapops.reloadEngine(mind, data, linked);
        return true;
      }
      if (mind) {
        try { mind.destroy(); } catch (_) {}
        mind = null;
      }
      engineLinked = linked;
      const ME = MindElixir.default || MindElixir;
      const opts = Object.assign({
        el: '#map',
        direction: MindElixir.SIDE,
        draggable: true,
        editable: true,
        contextMenu: true,
        toolBar: true,
        keypress: true,
        markdown: (topic) => (window.TF && window.TF.mindmapoutline && window.TF.mindmapoutline.renderTopicMd)
          ? window.TF.mindmapoutline.renderTopicMd(topic)
          : escapeTopicHtml(topic),
      }, window.TF.mindmapops.engineOptions(linked, {
        openModal: (evt) => openNoteFromContextMenu(evt, 'modal'),
        openPage: (evt) => openNoteFromContextMenu(evt, 'page'),
      }));
      if (linked) opts.markdown = linkedMarkdown;
      mind = new ME(opts);
      // Redirect fullscreen from #map to #app so the sidebar stays visible
      const mapEl = document.getElementById('map');
      mapEl.requestFullscreen = () => document.getElementById('app').requestFullscreen();

      mind.init(data);
      setTimeout(updateBadges, 300);
      // 5.15.1 only fires the 'selectNewNode' bus event for PROGRAMMATIC
      // selections (post-creation etc.) — a plain user click calls
      // selectNode(el) with no flag, so the event never fires. Wrap the
      // public selectNode method instead: it covers every selection path
      // (click, dblclick, keyboard nav, post-creation).
      const origSelectNode = mind.selectNode.bind(mind);
      mind.selectNode = el => {
        origSelectNode(el);
        clearTimeout(unselectTimer);
        const nodeObj = el && el.nodeObj;
        if (!nodeObj) return;
        currentNodeId = nodeObj.id;
        currentNodeData = nodeObj; // live reference to internal nodeObj — not a getData() copy
        renderPanel(nodeObj.topic, nodeObj.links || []);
        switchTab('ops');
        refreshOpsDisabled();
        window.parent.postMessage(
          { type: 'nodeSelected', nodeId: nodeObj.id, topic: nodeObj.topic, links: nodeObj.links || [] },
          window.location.origin
        );
      };

      const origUnselectNodes = mind.unselectNodes.bind(mind);
      mind.unselectNodes = els => {
        try { origUnselectNodes(els); } catch (_) {}
        unselectTimer = setTimeout(() => {
          cancelLinkFlow();
          currentNodeId = null;
          currentNodeData = null;
          hidePanel();
          switchTab(null);
          window.parent.postMessage({ type: 'nodeDeselected' }, window.location.origin);
        }, 50);
      };

      const origGetData = mind.getData.bind(mind);
      mind.getData = () => {
        const d = origGetData();
        d.justify = isJustifyActive;
        return d;
      };

      // Every layout() rebuilds the node DOM from scratch (nodes.innerHTML = ""),
      // which wipes the .node-link-badge children added by updateBadges. Re-apply
      // after every layout so badges survive init/refresh/direction changes/edits.
      // (Badges are position:absolute — they don't change layout, so no loop.)
      const origLayout = mind.layout.bind(mind);
      mind.layout = () => {
        origLayout();
        if (isJustifyActive) {
          applyJustifyLayout();
        }
        setTimeout(updateBadges, 0);
      };

      // Node toolbar button handlers
      document.getElementById('ntb-opennote').onclick = () => { sendOpenNoteAt(currentNodeData, 'modal'); };
      document.getElementById('ntb-child').onclick = () => { if (mind.currentNodes) mind.addChild(); };
      document.getElementById('ntb-sibling').onclick = () => { if (mind.currentNodes) mind.insertSibling('after'); };
      document.getElementById('ntb-promote').onclick = () => {
        if (!mind.currentNodes || mind.currentNodes.length === 0) return;
        const nodeEl = mind.currentNodes[0];
        const nodeObj = nodeEl.nodeObj;
        if (!nodeObj?.parent?.parent) return;
        const parentEl = mind.findEle(nodeObj.parent.id);
        // moveNodeAfter butuh ARRAY di argumen pertama (internal: ve(e).filter()).
        // Pindahkan node ke posisi tepat setelah parent-nya = promote satu level.
        // Memicu event 'operation' → listener kita auto postMessage 'change' (tersimpan).
        mind.moveNodeAfter([nodeEl], parentEl);
      };
      document.getElementById('ntb-edit').onclick = () => { if (mind.currentNodes) mind.beginEdit(); };
      document.getElementById('ntb-delete').onclick = () => {
        if (!mind.currentNodes) return;
        if (mind.currentNodes.some(n => !n.nodeObj?.parent)) return;
        if (confirm('Hapus node ini?')) mind.removeNodes(mind.currentNodes);
      };
      document.getElementById('ntb-parent').onclick = () => {
        if (!mind.currentNodes || mind.currentNodes.length === 0) return;
        if (!mind.currentNodes[0].nodeObj || !mind.currentNodes[0].nodeObj.parent) return;
        mind.insertParent();
      };
      document.getElementById('ntb-focus').onclick = () => {
        const el = mind.currentNodes && mind.currentNodes.length ? mind.currentNodes[0] : null;
        if (el && el.nodeObj && el.nodeObj.parent) mind.focusNode(el);
        // Catatan: focusNode clearSelection → panel Ops sembunyi (mirror desktop).
        // User tap node lain → panel muncul lagi, tombol Cancel Focus Mode tersedia.
      };
      document.getElementById('ntb-cancelfocus').onclick = () => { mind.cancelFocus(); };
      document.getElementById('ntb-moveup').onclick = () => {
        const el = mind.currentNodes && mind.currentNodes.length ? mind.currentNodes[0] : null;
        if (el && el.nodeObj && el.nodeObj.parent) mind.moveUpNode();
      };
      document.getElementById('ntb-movedown').onclick = () => {
        const el = mind.currentNodes && mind.currentNodes.length ? mind.currentNodes[0] : null;
        if (el && el.nodeObj && el.nodeObj.parent) mind.moveDownNode();
      };
      document.getElementById('ntb-summary').onclick = () => {
        if (mind.currentNodes && mind.currentNodes.length) mind.createSummary();
      };
      document.getElementById('ntb-link').onclick = () => startLinkFlow(false);
      document.getElementById('ntb-linkbi').onclick = () => startLinkFlow(true);

      // ── Export PNG/SVG (engine built-in) ─────────────────────────
      let exporting = false;
      const setExportDisabled = (disabled) => {
        document.getElementById("export-png").disabled = disabled;
        document.getElementById("export-svg").disabled = disabled;
      };
      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };
      const doExport = async (kind) => {
        if (!mind || exporting) return;
        exporting = true;
        setExportDisabled(true);
        try {
          let blob;
          if (kind === "png") {
            blob = await Promise.race([
              mind.exportPng(),
              new Promise((_, reject) => setTimeout(() => reject(new Error("export timeout")), 15000)),
            ]);
          } else {
            blob = mind.exportSvg();
          }
          downloadBlob(blob, window.TF.mindmapops.safeExportName(currentMindmapTitle, kind));
        } catch (_) {
          // engine export gagal (termasuk timeout canvas taint) — diam saja (iframe tak punya toast)
        } finally {
          setExportDisabled(false);
          exporting = false;
        }
      };
      document.getElementById("export-png").onclick = () => doExport("png");
      document.getElementById("export-svg").onclick = () => doExport("svg");

      // ── Formatting toolbar ──────────────────────────────────────
      const FMT_ACTIONS = {
        bold:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "**", "**", "teks"),
        italic:    (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "*", "*", "teks"),
        underline: (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "<u>", "</u>", "teks"),
        strike:    (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "~~", "~~", "teks"),
        highlight: (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "__", "__", "sorot"),
        heading:   (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "# ", false),
        code:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "`", "`", "kode"),
        link:      (t, s, e) => window.TF.mindmapoutline.wrapSelection(t, s, e, "[", "](https://)", "teks"),
        table:     (t, s, e) => window.TF.mindmapoutline.insertBlock(t, s, e, "| Kolom 1 | Kolom 2 | Kolom 3 |\n| --- | --- | --- |\n| isi | isi | isi |"),
        ul:        (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "- ", false),
        ol:        (t, s, e) => window.TF.mindmapoutline.prefixLines(t, s, e, "", true),
        hr:        (t, s, e) => window.TF.mindmapoutline.insertBlock(t, s, e, "---"),
      };

      function getEditSelection() {
        const box = document.getElementById('input-box');
        if (!box) return null;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || !box.contains(sel.anchorNode)) return { box, text: box.innerText, s: box.innerText.length, e: box.innerText.length };
        const walkOffsets = (targetNode, targetOffset) => {
          // sum lengths of nodes before targetNode inside box, then partial text
          let total = 0;
          let found = false;
          (function walk(node) {
            if (found) return;
            if (node === targetNode) {
              if (node.nodeType === 3) {
                total += targetOffset;
              } else {
                // element anchor (produced by setEditCaret at line starts):
                // count children before the offset with text/br semantics
                for (let ci = 0; ci < targetOffset && ci < node.childNodes.length; ci++) {
                  const ch = node.childNodes[ci];
                  total += ch.nodeName === 'BR' ? 1 : ch.textContent.length;
                }
              }
              found = true;
              return;
            }
            if (node.nodeType === 3) { total += node.textContent.length; return; }
            if (node.nodeName === 'BR') { total += 1; return; }
            for (const ch of node.childNodes) walk(ch);
          })(box);
          return total;
        };
        const a = walkOffsets(sel.anchorNode, sel.anchorOffset);
        const b = walkOffsets(sel.focusNode, sel.focusOffset);
        return { box, text: box.innerText, s: Math.min(a, b), e: Math.max(a, b) };
      }

      function setEditCaret(box, start, end) {
        const sel = window.getSelection();
        const range = document.createRange();
        let pos = 0, startNode = null, startOff = 0, endNode = null, endOff = 0;
        (function walk(node) {
          if (endNode != null) return;
          if (node.nodeName === 'BR') {
            pos += 1;
            if (startNode == null && pos >= start) { startNode = node.parentNode; startOff = Array.prototype.indexOf.call(node.parentNode.childNodes, node) + 1; }
            if (pos >= end) { endNode = node.parentNode; endOff = Array.prototype.indexOf.call(node.parentNode.childNodes, node) + 1; }
            return;
          }
          if (node.nodeType === 3) {
            const len = node.textContent.length;
            if (startNode == null && pos + len >= start) { startNode = node; startOff = Math.max(0, start - pos); }
            if (pos + len >= end) { endNode = node; endOff = Math.max(0, end - pos); }
            pos += len;
          } else {
            for (const ch of node.childNodes) { if (endNode != null) break; walk(ch); }
          }
        })(box);
        if (startNode && endNode) {
          range.setStart(startNode, Math.max(0, Math.min(startOff, startNode.nodeType === 3 ? startNode.textContent.length : startNode.childNodes.length)));
          range.setEnd(endNode, Math.max(0, Math.min(endOff, endNode.nodeType === 3 ? endNode.textContent.length : endNode.childNodes.length)));
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }

      document.querySelectorAll('#fmt-panel button').forEach(btn => {
        btn.onpointerdown = e => {
          e.preventDefault(); // keep focus in #input-box
          if (btn.dataset.act === 'align') {
            if (!currentNodeData) return;
            currentNodeData.align = btn.dataset.align;
            updateBadges(); // re-applies textAlign via the post-layout pass
            postChange();
            return;
          }
          const fn = FMT_ACTIONS[btn.dataset.act];
          if (!fn) return;
          const ed = getEditSelection();
          if (!ed) return;
          const res = fn(ed.text, ed.s, ed.e);
          ed.box.innerText = res.text;
          setEditCaret(ed.box, res.selStart, res.selEnd);
          ed.box.focus();
        };
      });

      // ✕ closes only the links pane — the node stays selected.
      document.getElementById('link-panel-close').onclick = () => {
        switchTab('ops');
      };

      mind.bus.addListener('operation', (op) => {
        hideNodeLinksPopover();
        if (op && op.name === 'beginEdit') switchTab('font');
        else switchTab('ops');
        if (isJustifyActive) {
          setTimeout(applyJustifyLayout, 0);
        }
        postChange();
      });

      mind.bus.addListener('changeDirection', () => {
        hideNodeLinksPopover();
        if (isJustifyActive) {
          setTimeout(applyJustifyLayout, 0);
        }
      });
      return false;
    }

    // ── Listener dokumen: dipasang sekali (initMind bisa membuat mesin ulang) ──
    {
      // Dismiss node links popover on click outside or escape key
      document.addEventListener('click', e => {
        if (activePopover && !activePopover.contains(e.target) && !e.target.closest('.node-link-badge')) {
          hideNodeLinksPopover();
        }
        const a = e.target && e.target.closest ? e.target.closest('me-tpc a') : null;
        if (a && a.href) {
          e.preventDefault();
          e.stopPropagation();
          window.open(a.href, '_blank', 'noopener');
        }
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          hideNodeLinksPopover();
        }
      });

      // Re-render panel after fullscreen exits so links stay visible;
      // renderPanel() shows the links pane, so restore the active tab after.
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && currentNodeId && currentNodeData) {
          setTimeout(() => {
            renderPanel(currentNodeData.topic, currentNodeData.links || []);
            const activeTab = document.querySelector('#side-tabs .side-tab.active');
            switchTab(activeTab ? activeTab.dataset.tab : null);
          }, 100);
        }
      });

      // Tertaut: Ctrl/Cmd+Click pada node membuka catatan di heading-nya. Fase
      // capture di #map agar jalan sebelum handler engine dan tautan di topik.
      document.getElementById('map').addEventListener('click', e => {
        if (!linkedMode || !mind) return;
        const ops = window.TF.mindmapops;
        if (!ops.isOpenNoteClick(e)) return;
        const tpc = ops.resolveTopicTarget(e.target);
        if (!tpc || !tpc.nodeObj) return;
        e.preventDefault();
        e.stopPropagation();
        sendOpenNoteAt(tpc.nodeObj, 'modal');
      }, true);

      // Tertaut: undo/redo milik catatan (engine allowUndo:false) — minta ke
      // induk. Saat mengetik di kotak edit node, biarkan undo teks browser.
      document.addEventListener('keydown', e => {
        if (!linkedMode || !(e.ctrlKey || e.metaKey) || e.altKey) return;
        const t = e.target;
        if (t && (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
            (t.closest && t.closest('#input-box')))) return;
        const k = (e.key || '').toLowerCase();
        let type = null;
        if (k === 'z') type = e.shiftKey ? 'redoRequest' : 'undoRequest';
        else if (k === 'y') type = 'redoRequest';
        if (!type) return;
        e.preventDefault();
        if (e.repeat) return; // tombol ditahan: satu permintaan per tekan, bukan beruntun
        window.parent.postMessage({ type: type }, window.location.origin);
      });
    }

    // The engine ships two built-in themes (Latte light / Dark) keyed by the
    // theme object's `type` — passing a minimal object with the right type makes
    // changeTheme apply the full internal palette. Follows the app theme.
    function applyMapTheme(dark) {
      if (!mind) return;
      try {
        mind.changeTheme({
          name: dark ? 'Dark' : 'Latte',
          type: dark ? 'dark' : 'light',
          palette: [],
          cssVar: {}
        });
      } catch (_) {}
    }

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data && e.data.type === 'setTheme') {
        document.documentElement.setAttribute('data-theme', e.data.theme === 'dark' ? 'dark' : 'light');
        applyMapTheme(e.data.theme === 'dark');
      }
      if (e.data && e.data.type === 'linkInfo') {
        const prevLinkInfo = liveLinkInfo;
        liveLinkInfo = (e.data.info && typeof e.data.info === 'object') ? e.data.info : {};
        if (!mind) return;
        if (currentNodeData && document.getElementById('link-panel').style.display === 'block') {
          renderPanel(currentNodeData.topic, currentNodeData.links || []);
        }
        if (activePopover && activeBadgeNodeId) {
          const popNodeId = activeBadgeNodeId;
          const popBadge = Array.from(document.querySelectorAll('me-tpc'))
            .find(el => el.nodeObj && el.nodeObj.id === popNodeId);
          const popNode = popBadge ? popBadge.nodeObj : null;
          const ML = window.TF && window.TF.mindmaplinks;
          // Buka ulang popover hanya bila info salah satu link node itu berubah (hindari kedip/scroll reset).
          const popChanged = !popNode || !ML || (popNode.links || []).some(l => {
            const k = ML.linkKey(l);
            return JSON.stringify(prevLinkInfo[k]) !== JSON.stringify(liveLinkInfo[k]);
          });
          if (!popChanged) { updateBadges(); return; }
          hideNodeLinksPopover();
          updateBadges();
          const newBadge = popBadge && popBadge.querySelector('.node-link-badge');
          if (popNode && newBadge) showNodeLinksPopover(popNode, newBadge);
          return;
        }
        updateBadges();
        return;
      }
      if (e.data && e.data.type === 'load') {
        hideNodeLinksPopover();
        hidePanel();
        switchTab(null);
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        cancelLinkFlow();
        isJustifyActive = Boolean(e.data.data && e.data.data.justify);
        linkedMode = Boolean(e.data.linked);
        linkedGen = linkedMode && e.data.gen != null ? e.data.gen : null;
        showSummary = e.data.showSummary !== false;
        applyLinkedUi(linkedMode);
        const reused = initMind(e.data.data, linkedMode);
        currentMindmapTitle = (typeof e.data.title === "string" && e.data.title.trim()) ? e.data.title.trim() : "mindmap";
        setTimeout(updateBadges, 300);
        const d = (e.data.data && typeof e.data.data.direction === 'number') ? e.data.data.direction : 2;
        try {
          // Muat ulang tertaut dengan arah yang sama: refresh() sudah menata ulang; initX()
          // akan memanggil toCenter() dan membuang geseran pengguna.
          if (reused && linkedMode && mind.direction === d) { /* geseran tetap */ }
          else if (d === 0) mind.initLeft();
          else if (d === 1) mind.initRight();
          else if (d === 3) mind.initDown();
          else mind.initSide();
        } catch (_) {}
        applyMapTheme(document.documentElement.getAttribute('data-theme') === 'dark');
        if (isJustifyActive) {
          setTimeout(applyJustifyLayout, 50);
        }
      }
      if (e.data && e.data.type === 'setSummary') {
        showSummary = Boolean(e.data.show);
        // refresh() tanpa data: render ulang pohon hidup lewat markdown. Dengan
        // getData() saat Focus Mode, pohon penuh akan menggantikan subtree fokus.
        if (mind) { try { mind.refresh(); } catch (_) {} }
        return;
      }
      if (e.data && e.data.type === 'remapSids') {
        // Hanya data: tanpa render ulang. Cari di pohon data (bukan findEle):
        // node yang terlipat tidak ada di DOM dan findEle melempar error;
        // saat Focus Mode pohon penuh ada di nodeDataBackup.
        // gen = generasi sesi setelah tulisan: node yang dipasangkan dicap ulang (sid + ns); node lain
        // (mis. tempelan sesudahnya) tetap bercap lama → asing bagi induk.
        if (!mind || !Array.isArray(e.data.pairs)) return;
        const gen = e.data.gen != null ? e.data.gen : null;
        const tree = mind.isFocusMode ? mind.nodeDataBackup : mind.nodeData;
        e.data.pairs.forEach(pair => {
          if (!Array.isArray(pair)) return;
          const nodeObj = tree ? findNode(tree, pair[0]) : null;
          if (nodeObj) nodeObj.nm = Object.assign(nodeObj.nm || {}, { sid: pair[1], ns: gen });
        });
        if (linkedMode) linkedGen = gen;
        return;
      }
      if (e.data && e.data.type === 'setJustify') {
        if (!mind) return;
        isJustifyActive = Boolean(e.data.justify);
        applyJustifyLayout();
        postChange();
      }
      if (e.data && e.data.type === 'remoteUpdate') {
        // #4: isi jarak jauh (anggota lain / hasil merge). Bukan edit pengguna → tidak mengirim pesan change ke induk.
        // Jangan pernah menimpa ketikan: kotak edit node (#input-box) aktif atau alur pilih-link berjalan → remoteSkipped.
        const box = document.getElementById('input-box');
        if (!mind || linkFlowActive || (box && box.isConnected && box.offsetParent !== null)) {
          window.parent.postMessage({ type: 'remoteSkipped', seq: e.data.seq }, window.location.origin);
          return;
        }
        const selId = currentNodeId;
        hideNodeLinksPopover();
        // Data baru menggantikan pohon: keluar dari Focus Mode dulu (getData() memakai nodeDataBackup).
        try { window.TF.mindmapops.exitFocusMode(mind); } catch (_) {}
        isJustifyActive = Boolean(e.data.data && e.data.data.justify);
        // refresh() menata ulang tanpa memindah viewport (initX() hanya bila arah berubah)
        try { mind.refresh(e.data.data); } catch (_) {}
        // Riwayat undo lama menunjuk pohon sebelum pembaruan → kosongkan (undo tidak boleh menghapus perubahan anggota lain).
        try { window.TF.mindmapops.resetUndo(mind); } catch (_) {}
        const d = (e.data.data && typeof e.data.data.direction === 'number') ? e.data.data.direction : mind.direction;
        if (d !== mind.direction) {
          try {
            if (d === 0) mind.initLeft();
            else if (d === 1) mind.initRight();
            else if (d === 3) mind.initDown();
            else mind.initSide();
          } catch (_) {}
        }
        if (typeof e.data.title === 'string' && e.data.title.trim()) currentMindmapTitle = e.data.title.trim();
        // Pilih ulang node terpilih bila masih ada; bila hilang, tutup panel seperti clearPanel.
        let reselected = false;
        if (selId) {
          try {
            const el = mind.findEle(selId);
            if (el) { mind.selectNode(el); reselected = true; }
          } catch (_) {}
        }
        if (!reselected) {
          currentNodeId = null;
          currentNodeData = null;
          clearTimeout(unselectTimer);
          hidePanel();
          switchTab(null);
          if (selId) window.parent.postMessage({ type: 'nodeDeselected' }, window.location.origin);
        }
        if (isJustifyActive) setTimeout(applyJustifyLayout, 50);
        setTimeout(updateBadges, 300);
        window.parent.postMessage({ type: 'remoteApplied', seq: e.data.seq }, window.location.origin);
        return;
      }
      if (e.data && e.data.type === 'refresh') {
        if (!mind) return;
        hideNodeLinksPopover();
        // mind.refresh clears map selection but not our module-level
        // currentNodeId/currentNodeData — reset like clearPanel so the link
        // panel never shows a renamed/removed node's old topic.
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        cancelLinkFlow();
        hidePanel();
        switchTab(null);
        // Data baru menggantikan pohon: keluar dari Focus Mode dulu (getData() memakai nodeDataBackup).
        try { window.TF.mindmapops.exitFocusMode(mind); } catch (_) {}
        try { mind.refresh(e.data.data); } catch (_) {}
        // Pohon diganti induk (edit Outline / kanvas dikembalikan ke versi lokal): snapshot undo lama tidak berlaku lagi.
        try { window.TF.mindmapops.resetUndo(mind); } catch (_) {}
        setTimeout(updateBadges, 300);
        return;
      }
      if (e.data && e.data.type === 'setDirection') {
        if (!mind) return;
        try {
          const changed = mind.direction !== e.data.direction;
          if (e.data.direction === 0) mind.initLeft();
          else if (e.data.direction === 1) mind.initRight();
          else if (e.data.direction === 2) mind.initSide();
          else if (e.data.direction === 3) mind.initDown();
          else return;
          if (changed) {
            postChange();
          }
        } catch (_) {}
      }
      if (e.data && e.data.type === 'clearPanel') {
        hideNodeLinksPopover();
        currentNodeId = null;
        currentNodeData = null;
        clearTimeout(unselectTimer);
        cancelLinkFlow();
        hidePanel();
        switchTab(null);
      }
      if (e.data && e.data.type === 'addLink') {
        if (!currentNodeId || e.data.nodeId !== currentNodeId || !currentNodeData) return;
        if (!currentNodeData.links) currentNodeData.links = [];
        const alreadyLinked = currentNodeData.links.some(
          l => l.type === e.data.link.type && l.id === e.data.link.id
        );
        if (alreadyLinked) return;
        currentNodeData.links.push(e.data.link);
        renderPanel(currentNodeData.topic, currentNodeData.links);
        switchTab('links');
        updateBadges();
        postChange();
      }
    });

    window.parent.postMessage({ type: 'ready' }, window.location.origin);
  </script>
</body>
</html>
