<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu Pomodoro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;family=Nunito:wght@700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1120px; height: 440px; box-sizing: border-box; padding: 24px; background: {{c.page}}; color: {{c.text}}; font-family: 'Nunito Sans', -apple-system, 'Segoe UI', sans-serif;">
<section style="position: relative; overflow: hidden; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; border-radius: 20px; padding: 24px 28px; background: {{cardBg}}; border: 1px solid {{cardBorder}}; box-shadow: {{cardShadow}};">

<svg aria-hidden="true" viewBox="0 0 832 272" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.3) 35%, #000 70%); mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.3) 35%, #000 70%);">
<g fill="none" stroke="{{c.accent}}" style="stroke-width: 1; opacity: {{topoOp}}">
<path d="M560 24 C570 10 610 6 630 18 C646 28 640 44 618 48 C594 52 552 40 560 24 Z"></path>
<path d="M470 0 C500 40 560 70 620 64 C690 58 720 20 730 0"></path>
<path d="M430 0 C460 60 540 104 620 98 C710 92 760 40 770 0"></path>
<path d="M390 0 C420 80 520 140 620 134 C730 128 800 60 810 0"></path>
<path d="M350 0 C380 100 500 176 630 170 C760 164 832 90 832 40"></path>
<path d="M320 40 C340 140 480 214 640 206 C780 200 832 150 832 120"></path>
<path d="M300 120 C330 200 460 252 620 246 C740 242 800 220 832 200"></path>
<path d="M730 272 C736 248 762 238 784 244 C804 250 816 262 818 272"></path>
<path d="M690 272 C700 230 740 212 780 218 C812 224 832 244 832 252"></path>
</g>
</svg>
<div aria-hidden="true" style="position: absolute; top: -60%; left: -10%; width: 60%; height: 200%; background: {{glow}}; pointer-events: none;"></div>

<div style="position: relative; width: 168px; height: 168px;">
<svg aria-hidden="true" viewBox="0 0 168 168" style="width: 168px; height: 168px; display: block; transform: rotate(-90deg);"><circle cx="84" cy="84" r="76" fill="none" stroke="{{track}}" style="stroke-width: 9"></circle><circle cx="84" cy="84" r="76" fill="none" stroke="{{ink}}" style="stroke-width: 9; stroke-linecap: round; stroke-dasharray: {{ringDash}}"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 42px; font-weight: 700; letter-spacing: -1.5px; color: {{inkText}}; line-height: 1;">{{time}}</span>
<span style="font-size: 11px; color: {{c.sec}}; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">{{label}}</span>
</div>
</div>

<div style="position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
<div>
<h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: {{c.heading}}; font-size: 19px; font-weight: 800; color: {{c.text}};">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><circle cx="12" cy="13" r="8" fill="{{inkSoft}}" stroke="{{inkText}}" style="stroke-width: 2"></circle><path d="M12 9v4l2.5 2" fill="none" stroke="{{inkText}}" style="stroke-width: 2; stroke-linecap: round"></path></svg>
Pomodoro</h2>
<p style="margin: 2px 0 0; font-size: 13px; color: {{c.sec}};">{{sub}}</p>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" aria-label="Zen Mode" style="width: 38px; height: 34px; border-radius: 10px; border: 1px solid {{chipBorder}}; background: {{chipBg}}; color: {{c.sec}}; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 17px; height: 17px;"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" style="stroke-width: 2"></path><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" style="stroke-width: 2"></circle></svg>
</button>
<div role="radiogroup" aria-label="Mode Pomodoro" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: {{chipBg}}; border: 1px solid {{chipBorder}};">
<button type="button" style="border: none; font: inherit; font-size: 13px; font-weight: 700; padding: 5px 13px; border-radius: 999px; cursor: pointer; background: {{modeWorkBg}}; color: {{modeWorkInk}};">Work</button>
<button type="button" style="border: none; font: inherit; font-size: 13px; font-weight: 700; padding: 5px 13px; border-radius: 999px; cursor: pointer; background: {{modeShortBg}}; color: {{modeShortInk}};">Short</button>
<button type="button" style="border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 700; padding: 5px 13px; border-radius: 999px; cursor: pointer; color: {{c.sec}};">Long</button>
</div>
</div>
</div>

<sc-if value="{{isAwaiting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 18px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: #22c55e; color: #052e16;">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z M16 11h2a2 2 0 0 1 0 4h-2" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linejoin: round"></path></svg>
Ambil Istirahat</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: #7c3aed; color: #FFFFFF;">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path d="M7 4 L19 12 L7 20 Z" fill="currentColor"></path></svg>
Lanjut Fokus <small style="font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px; border-radius: 999px; background: rgba(255,255,255,0.24);">OVERTIME</small></button>
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{btnBg}}; color: {{c.text}}; border: 1px solid {{chipBorder}};">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>
Stop</button>
</div>
</sc-if>
<sc-if value="{{isRunning}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 20px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: #f59e0b; color: #1f1300;">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg>
Jeda</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{btnBg}}; color: {{c.text}}; border: 1px solid {{chipBorder}};">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path d="M5 5 L14 12 L5 19 Z M15 5 h3 v14 h-3 Z" fill="currentColor"></path></svg>
Lewati</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{btnBg}}; color: {{c.text}}; border: 1px solid {{chipBorder}};">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>
Stop</button>
</div>
</sc-if>

<label style="display: block; border-bottom: 1px solid {{chipBorder}};">
<input type="text" aria-label="Parkir distraksi" placeholder="Ada pikiran lewat? Ketik &amp; tekan Enter untuk simpan ke Inbox..." style="width: 100%; box-sizing: border-box; border: 0; outline: none; background: transparent; font: inherit; font-size: 13.5px; padding: 8px 2px; color: {{c.text}};">
</label>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: {{taskBg}}; border: 1px solid {{chipBorder}};">
<span style="width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: {{inkSoft}}; color: {{inkText}}; flex-shrink: 0;">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" style="stroke-width: 2"></circle><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" style="stroke-width: 2"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>
</span>
<span style="flex: 1; min-width: 0;">
<span style="display: block; font-size: 10px; font-weight: 800; color: {{c.sec}}; text-transform: uppercase; letter-spacing: .06em;">Task aktif</span>
<span style="display: block; font-size: 14.5px; font-weight: 700; color: {{c.text}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">followup data dossier msbt besok</span>
</span>
<span style="font-size: 13px; font-weight: 700; color: {{c.sec}};"><span style="color: {{stat.red}};">3</span> / 1</span>
</div>

<div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
<span style="display: flex; align-items: baseline; gap: 7px;"><b style="font-size: 18px; font-weight: 800; color: {{stat.red}};">1</b><span style="font-size: 11px; font-weight: 700; color: {{c.sec}}; text-transform: uppercase; letter-spacing: .5px;">Pomodoro</span></span>
<span style="display: flex; align-items: baseline; gap: 7px;"><b style="font-size: 18px; font-weight: 800; color: {{stat.green}};">23m</b><span style="font-size: 11px; font-weight: 700; color: {{c.sec}}; text-transform: uppercase; letter-spacing: .5px;">Waktu fokus</span></span>
<span style="display: flex; align-items: baseline; gap: 7px;"><b style="font-size: 18px; font-weight: 800; color: {{c.accentText}};">0</b><span style="font-size: 11px; font-weight: 700; color: {{c.sec}}; text-transform: uppercase; letter-spacing: .5px;">Set lengkap</span></span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px; color: {{c.sec}};">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M4 14v-2a8 8 0 0 1 16 0v2 M4 14h3v5H5a1 1 0 0 1-1-1z M20 14h-3v5h2a1 1 0 0 0 1-1z" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linejoin: round"></path></svg>
<select aria-label="Suara latar" style="font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 8px; background: {{btnBg}}; color: {{c.text}}; border: 1px solid {{chipBorder}};"><option>Hujan</option></select>
<span aria-hidden="true" style="display: inline-block; width: 88px; height: 4px; border-radius: 4px; background: {{c.accent}}; position: relative;"><span style="position: absolute; right: -6px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: {{c.card}}; border: 2px solid {{c.accent}}; box-sizing: border-box;"></span></span>
</span>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["default","sakura","lavender"],"default":"sakura"},"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["running","awaiting","break"],"default":"running"},"$preview":{"width":1120,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      default: {
        light: { page: '#FCFCFB', card: '#FFFFFF', text: '#0f172a', sec: '#64748b', border: '#E8E8E0', accent: '#A8C500', accentText: '#6B8000', rgb: '168,197,0', textRgb: '15,23,42' },
        dark: { page: '#171717', card: '#262626', text: '#e5e5e5', sec: '#a3a3a3', border: '#404040', accent: '#A8C500', accentText: '#A8C500', rgb: '168,197,0', textRgb: '229,229,229' }
      },
      sakura: {
        light: { page: '#FDF5FA', card: '#FFFFFF', text: '#3A2438', sec: '#694763', border: '#F0D2E5', accent: '#B0287E', accentText: '#B0287E', rgb: '176,40,126', textRgb: '58,36,56' },
        dark: { page: '#1C1219', card: '#291B26', text: '#FBEAF5', sec: '#DDBCD3', border: '#3E2A3A', accent: '#EE8FCB', accentText: '#EE8FCB', rgb: '238,143,203', textRgb: '251,234,245' }
      },
      lavender: {
        light: { page: '#FAF6FD', card: '#FFFFFF', text: '#30243C', sec: '#5B4870', border: '#E2D4F0', accent: '#8A3AAE', accentText: '#8A3AAE', rgb: '138,58,174', textRgb: '48,36,60' },
        dark: { page: '#18131D', card: '#231C2B', text: '#F3EAFB', sec: '#D3C3E6', border: '#382D45', accent: '#CDA2F2', accentText: '#CDA2F2', rgb: '205,162,242', textRgb: '243,234,251' }
      }
    };
    const palette = P[this.props.palette] ? this.props.palette : 'sakura';
    const dark = this.props.mode === 'dark';
    const c = Object.assign({}, P[palette][dark ? 'dark' : 'light']);
    c.heading = palette === 'default' ? "'Nunito Sans', sans-serif" : "'Nunito', 'Nunito Sans', sans-serif";
    const state = this.props.state || 'running';
    const isBreak = state === 'break';

    const inkRgb = isBreak ? '34,197,94' : '239,68,68';
    const ink = isBreak ? '#22c55e' : '#ef4444';
    const inkText = dark ? (isBreak ? '#86efac' : '#f87171') : (isBreak ? '#15803d' : '#dc2626');
    const inkSoft = 'rgba(' + inkRgb + ',' + (dark ? '0.18' : '0.12') + ')';

    const cardBg = dark
      ? 'linear-gradient(135deg, ' + c.card + ' 0%, ' + c.page + ' 100%)'
      : 'linear-gradient(120deg, rgba(' + inkRgb + ',0.07) 0%, ' + c.card + ' 38%, ' + c.card + ' 62%, rgba(' + c.rgb + ',0.10) 100%), ' + c.card;
    const glow = 'radial-gradient(circle at 30% 50%, rgba(' + inkRgb + ',' + (dark ? '0.20' : '0.10') + ') 0%, transparent 60%)';

    const circ = 2 * Math.PI * 76;
    const frac = state === 'awaiting' ? 1 : (state === 'break' ? 0.35 : 0.26);
    const ringDash = (circ * frac).toFixed(1) + ' ' + circ.toFixed(1);

    return {
      c, cardBg, glow, ink, inkText, inkSoft, ringDash,
      cardBorder: dark ? c.border : 'rgba(' + c.rgb + ',0.22)',
      cardShadow: dark ? 'none' : '0 1px 2px rgba(15,23,42,0.04), 0 6px 20px rgba(15,23,42,0.05)',
      topoOp: dark ? 0.22 : 0.20,
      track: 'rgba(' + c.textRgb + ',' + (dark ? '0.12' : '0.08') + ')',
      chipBg: 'rgba(' + c.textRgb + ',' + (dark ? '0.06' : '0.04') + ')',
      chipBorder: 'rgba(' + c.textRgb + ',' + (dark ? '0.14' : '0.10') + ')',
      btnBg: dark ? 'rgba(255,255,255,0.06)' : c.card,
      taskBg: dark ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.75)',
      modeWorkBg: isBreak ? 'transparent' : inkSoft,
      modeWorkInk: isBreak ? c.sec : inkText,
      modeShortBg: isBreak ? inkSoft : 'transparent',
      modeShortInk: isBreak ? inkText : c.sec,
      stat: { red: dark ? '#f87171' : '#dc2626', green: dark ? '#4ade80' : '#15803d' },
      time: state === 'awaiting' ? '00:00' : (state === 'break' ? '03:15' : '18:42'),
      label: state === 'awaiting' ? 'Selesai' : (state === 'break' ? 'Istirahat' : 'Fokus'),
      sub: state === 'awaiting' ? 'Lanjut fokus atau istirahat?' : (state === 'break' ? 'Istirahat sebentar...' : 'Fokus pada satu task'),
      isAwaiting: state === 'awaiting',
      isRunning: state !== 'awaiting'
    };
  }
}
</script>
</body>
</html>
